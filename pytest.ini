[pytest]
# Scope collection to the repository's real test suite.
#
# Root cause (2026-11-13): `python -m pytest -q` from the repo root scans the
# whole tree. The autonomy worker snapshots entire repo copies under
# outputs/autonomy/agent-workspaces/<hash>/workspace/ (gitignored runtime
# data). Because test modules are imported rootless by basename, the snapshot
# copies were imported first and every real tests/test_*.py then failed with
# "import file mismatch" (74 collection errors). CI is unaffected (fresh
# checkout has no outputs/), but local runs must be deterministic.
testpaths = tests
